name: Deploy site to GitHub Pages

# site/ is static. One build step writes site/demo/: the real viewer plus
# API answers that llmly computes from fictional logs.
on:
  push:
    branches: [main]
    paths: [site/**, llmly/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the page shows the commit count
      - uses: astral-sh/setup-uv@v10
      - run: uv run python site/scripts/build_demo.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
